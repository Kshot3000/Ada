<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Ada</title>
  <meta http-equiv="refresh" content="0; url=/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background:
        radial-gradient(600px 400px at 50% 30%, rgba(42, 90, 219, 0.10), rgba(42, 90, 219, 0) 70%),
        #ffffff;
      color: #14245f;
    }
    main { padding: 24px; }
    .hex {
      width: 84px; height: 84px; margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 22px;
      background: linear-gradient(135deg, #0033ad, #4d7cff);
      color: #fff; font-size: 40px; font-weight: 800;
      box-shadow: 0 10px 40px rgba(0, 51, 173, 0.25);
    }
    .code { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #2a5adb; margin: 0 0 6px; }
    h1 { font-size: 30px; margin: 0 0 10px; color: #0b1f6b; }
    p { color: #5a6ca8; margin: 0 0 22px; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #0033ad, #2a5adb);
      color: #fff; font-weight: 600; font-size: 14px;
      padding: 11px 22px; border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(0, 51, 173, 0.25);
    }
  </style>
</head>
<body>
  <main>
    <div class="hex" aria-hidden="true">A</div>
    <p class="code">404 · BLOCK NOT FOUND</p>
    <h1>This block doesn't exist on Cardano.</h1>
    <p>Ada is taking you back to the main page…</p>
    <a href="/">← Back to Ada</a>
  </main>
</body>
</html>
